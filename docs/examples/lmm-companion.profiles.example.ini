[cpu_safe]
display_name = CPU safe
description = Slow but reliable CPU launch.
type = llama_server
port = 18080
ctx_size = 4096
gpu_layers = 0
threads = 8
parallel = 1
flash_attention = false
mmap = true

[gpu_balanced_16gb]
display_name = GPU balanced 16GB
description = Partial GPU offload for larger models.
type = llama_server
port = 18081
ctx_size = 4096
gpu_layers = 20
threads = 8
parallel = 1
flash_attention = true
mmap = true

[low_memory]
display_name = Low memory
description = Lower context and no GPU offload.
type = llama_server
port = 18082
ctx_size = 2048
gpu_layers = 0
threads = 8
parallel = 1
flash_attention = false
mmap = true

[full_offload_risky]
display_name = Full offload risky
description = Advanced experiment only. Can OOM on large models.
type = llama_server
port = 18083
ctx_size = 4096
gpu_layers = 999
threads = 8
parallel = 1
flash_attention = true
mmap = true
