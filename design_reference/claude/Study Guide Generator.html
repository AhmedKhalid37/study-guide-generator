<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Guide Generator — App Design</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; min-height: 100vh; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="mobile.jsx"></script>
<script type="text/babel" src="windows.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
function PhoneFrame({ children }) {
  return (
    <IOSDevice width={402} height={874} dark={true}>
      {children}
    </IOSDevice>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="ios"
        title="Study Guide Generator · iOS"
        subtitle="Dark navy + warm orange. Serif headings, sans body. Four core screens."
      >
        <DCArtboard id="welcome" label="Welcome · onboarding" width={402} height={874}>
          <PhoneFrame><WelcomeScreen/></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="home" label="Home · dashboard" width={402} height={874}>
          <PhoneFrame><HomeScreen/></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="editorial" label="Style detail · Editorial" width={402} height={874}>
          <PhoneFrame><EditorialDetailScreen/></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="examcram" label="Style detail · Exam Cram" width={402} height={874}>
          <PhoneFrame><ExamCramScreen/></PhoneFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="windows"
        title="Study Guide Generator · Windows 11"
        subtitle="Mica-tinted desktop chrome, sidebar nav, multi-pane workspace. Two scenes."
      >
        <DCArtboard id="win-home" label="Home dashboard" width={1280} height={800}>
          <WindowsHomeScreen/>
        </DCArtboard>
        <DCArtboard id="win-builder" label="Builder · composer + live preview" width={1280} height={800}>
          <WindowsBuilderScreen/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
